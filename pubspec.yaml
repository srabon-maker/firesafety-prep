
name: fire_safety_job_prep
description: Fire Safety BD mobile application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Google Login
  google_sign_in: ^7.2.0

  # Secure Login Session Storage
  flutter_secure_storage: ^9.2.4

  # Connect Flutter with PHP APIs
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fire_safety_job_prep_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/fire_safety_job_prep_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#650D18"
  adaptive_icon_foreground: "assets/fire_safety_job_prep_logo.png"
