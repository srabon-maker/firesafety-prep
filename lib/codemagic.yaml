workflows:
  android-apk:
    name: Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Create Android project files
        script: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --org com.firesafetybd --project-name jobprep --platforms=android .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
      - name: Set app name
        script: |
          sed -i 's/android:label="[^"]*"/android:label="Fire Safety Job Prep"/' android/app/src/main/AndroidManifest.xml
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
