name: PHP syntax check

on:
  push:
    paths:
      - 'backend/**/*.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'backend/**/*.php'
      - '.github/workflows/php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    container: php:8.3-cli
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Lint every backend PHP file
        run: find backend -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
