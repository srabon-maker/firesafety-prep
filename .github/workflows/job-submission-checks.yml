name: Job circular checks (no APK build)

on:
  push:
    branches:
      - feature/structured-job-circular-details
  pull_request:
    paths:
      - 'backend/api/jobs/**'
      - 'backend/api/community/**'
      - 'backend/community_review.php'
      - 'backend/job_submission_review.php'
      - 'backend/job_circulars.php'
      - 'backend/migrations/**'
      - 'lib/screens/jobs_page.dart'
      - 'lib/screens/community_page.dart'
      - 'lib/widgets/post_card.dart'
      - 'lib/models/community_post.dart'
      - 'lib/services/community_service.dart'
      - 'pubspec.yaml'
      - 'lib/screens/profile_page.dart lib/screens/community_page.dart lib/widgets/post_card.dart lib/models/community_post.dart lib/services/community_service.dart'
      - 'lib/screens/submit_job_page.dart'
      - 'lib/models/job_circular.dart'
      - 'lib/utils/job_notice_sections.dart'
      - 'lib/services/job_submission_service.dart'
      - 'test/job_notice_sections_test.dart'
      - 'test/community_post_test.dart'
      - 'test/job_submission_contacts_test.dart'
      - '.github/workflows/job-submission-checks.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          php -l backend/api/jobs/list.php
          php -l backend/api/jobs/submission_common.php
          php -l backend/api/jobs/submit.php
          php -l backend/api/jobs/my_submissions.php
          php -l backend/job_submission_review.php
          php -l backend/job_circulars.php
          php -l backend/api/community/index.php
          php -l backend/community_review.php
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed Flutter code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/models/job_circular.dart lib/utils/job_notice_sections.dart lib/services/job_submission_service.dart lib/screens/submit_job_page.dart lib/screens/jobs_page.dart lib/screens/home_page.dart lib/screens/profile_page.dart
      - name: Test jobs parser and submission contact mapping
        run: flutter test test/job_notice_sections_test.dart test/job_submission_contacts_test.dart test/job_circular_test.dart test/community_post_test.dart
