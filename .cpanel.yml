---
# Temporary scoped deployment: Career / Professional Directory, Exam Results, Admin Support and branding.
# Restore the previous full deployment configuration after this release is verified.
deployment:
  tasks:
    - export DEPLOYPATH=/home2/manobiki/fire.manobikishwarganj.com
    - export BACKUPPATH=/home2/manobiki/fire-safety-deploy-backups
    - 'export RELEASEBACKUP="$BACKUPPATH/career-exam-support-$(date +%Y%m%d-%H%M%S)"'
    - /bin/test -d "$DEPLOYPATH"
    - /bin/test -f "$DEPLOYPATH/db.php"
    - /bin/test -f "$DEPLOYPATH/admin_helpers.php"
    - 'set -eu; /bin/test -s backend/assets/fire-safety-bd-logo.png; /bin/test -s assets/fire_safety_job_prep_logo.png; /bin/test -d "$DEPLOYPATH/assets"; /bin/test ! -L "$DEPLOYPATH/assets"; /bin/test -f "$DEPLOYPATH/assets/fire-safety-bd-logo.png"; /bin/test ! -L "$DEPLOYPATH/assets/fire-safety-bd-logo.png"; echo "9fe54525ef24693cd84e829c7c048261be5e28d559606746d52cdb7b21112fe8  backend/assets/fire-safety-bd-logo.png" | sha256sum -c -; echo "5f0aeb5f4c7ec87e59cf7e89bf6cd89c022245152d128b5ec4139d3d2e433900  assets/fire_safety_job_prep_logo.png" | sha256sum -c -'
    - /bin/test -f backend/support_common.php
    - /bin/test -f backend/support_admin.php
    - /bin/test -f backend/api/support/index.php
    - /bin/test -f backend/premium_access.php
    - 'set -eu; for f in backend/support_common.php backend/support_admin.php backend/api/support/index.php backend/premium_access.php scripts/check_support_schema.php; do php -l "$f" >/dev/null; done; result=$(php scripts/check_support_schema.php "$DEPLOYPATH" 2>/dev/null) || { echo "Support schema preflight failed: check migration before deploying" >&2; exit 1; }; /bin/test "$result" = SUPPORT_SCHEMA_OK'
    - 'set -eu; for f in api api/support support_common.php support_admin.php api/support/index.php premium_access.php; do /bin/test ! -L "$DEPLOYPATH/$f"; done; for f in support_common.php support_admin.php api/support/index.php premium_access.php; do if /bin/test -e "$DEPLOYPATH/$f"; then /bin/test -f "$DEPLOYPATH/$f"; fi; done; if /bin/test -f "$DEPLOYPATH/premium_access.php"; then php -l "$DEPLOYPATH/premium_access.php" >/dev/null; php -r "require \$argv[1]; exit(function_exists(\"premium_bearer_user\") ? 0 : 1);" "$DEPLOYPATH/premium_access.php"; fi'
    - /bin/test -f backend/career_common.php
    - /bin/test -f backend/career_admin.php
    - /bin/test -f backend/api/career/index.php
    - /bin/test -s backend/api/tests.php
    - '/bin/test -f "$DEPLOYPATH/api/tests.php"'
    - '/bin/test ! -L "$DEPLOYPATH/api/tests.php"'
    - '/bin/test ! -L "$DEPLOYPATH/api"'
    - '/bin/mkdir -p "$DEPLOYPATH/api/career"'
    - '/bin/test ! -L "$DEPLOYPATH/api/career"'
    - '/bin/test ! -L "$DEPLOYPATH/career_common.php"'
    - '/bin/test ! -L "$DEPLOYPATH/career_admin.php"'
    - '/bin/test ! -L "$DEPLOYPATH/api/career/index.php"'
    - '/bin/mkdir -p -m 700 "$RELEASEBACKUP/api/career"'
    - 'set -eu; for f in career_common.php career_admin.php api/career/index.php api/tests.php; do if /bin/test -e "$DEPLOYPATH/$f"; then /bin/cp -p "$DEPLOYPATH/$f" "$RELEASEBACKUP/$f"; fi; done; /bin/test -s "$RELEASEBACKUP/api/tests.php"; /bin/cp -p backend/career_common.php "$DEPLOYPATH/career_common.php"; /bin/cp -p backend/career_admin.php "$DEPLOYPATH/career_admin.php"; /bin/cp -p backend/api/career/index.php "$DEPLOYPATH/api/career/index.php"; /bin/cp -p backend/api/tests.php "$DEPLOYPATH/api/tests.php"; /bin/test -s "$DEPLOYPATH/api/tests.php"; /bin/test -s "$DEPLOYPATH/career_common.php"; /bin/test -s "$DEPLOYPATH/career_admin.php"; /bin/test -s "$DEPLOYPATH/api/career/index.php"'
    - '/bin/mkdir -p "$DEPLOYPATH/api/support" "$RELEASEBACKUP/api/support"'
    - 'set -eu; for f in support_common.php support_admin.php api/support/index.php premium_access.php; do if /bin/test -f "$DEPLOYPATH/$f"; then /bin/cp -p "$DEPLOYPATH/$f" "$RELEASEBACKUP/$f"; /bin/test -s "$RELEASEBACKUP/$f"; fi; done; if /bin/test ! -e "$DEPLOYPATH/premium_access.php"; then /bin/cp -p backend/premium_access.php "$DEPLOYPATH/premium_access.php"; fi; for f in support_common.php support_admin.php api/support/index.php; do /bin/cp -p "backend/$f" "$DEPLOYPATH/$f"; /bin/test -s "$DEPLOYPATH/$f"; php -l "$DEPLOYPATH/$f" >/dev/null; done; echo "Support files installed; verify authenticated user and admin flows"'
    - 'set -eu; /bin/mkdir -p -m 700 "$RELEASEBACKUP/assets"; /bin/cp -p "$DEPLOYPATH/assets/fire-safety-bd-logo.png" "$RELEASEBACKUP/assets/fire-safety-bd-logo.png"; /bin/test -s "$RELEASEBACKUP/assets/fire-safety-bd-logo.png"; tmp=$(mktemp "$DEPLOYPATH/assets/.fire-safety-bd-logo.XXXXXX"); trap "/bin/rm -f -- \"$tmp\"" EXIT; /bin/cp backend/assets/fire-safety-bd-logo.png "$tmp"; /bin/chmod --reference="$DEPLOYPATH/assets/fire-safety-bd-logo.png" "$tmp"; /bin/mv -f "$tmp" "$DEPLOYPATH/assets/fire-safety-bd-logo.png"; /bin/cmp -s backend/assets/fire-safety-bd-logo.png "$DEPLOYPATH/assets/fire-safety-bd-logo.png"; echo "Brand logo deployed"'
