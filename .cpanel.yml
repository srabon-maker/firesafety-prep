---
# Temporary scoped deployment: Career / Professional Directory and Exam Results API.
# Restore the previous full deployment configuration after this release is verified.
deployment:
  tasks:
    - export DEPLOYPATH=/home2/manobiki/fire.manobikishwarganj.com
    - export BACKUPPATH=/home2/manobiki/fire-safety-deploy-backups
    - 'export RELEASEBACKUP="$BACKUPPATH/career-exam-$(date +%Y%m%d-%H%M%S)"'
    - /bin/test -d "$DEPLOYPATH"
    - /bin/test -f "$DEPLOYPATH/db.php"
    - /bin/test -f "$DEPLOYPATH/admin_helpers.php"
    - /bin/test -f backend/career_common.php
    - /bin/test -f backend/career_admin.php
    - /bin/test -f backend/api/career/index.php
    - /bin/test -s backend/api/tests.php
    - '/bin/test -f "$DEPLOYPATH/api/tests.php"'
    - '/bin/test ! -L "$DEPLOYPATH/api/tests.php"'
    - '/bin/test ! -L "$DEPLOYPATH/api"'
    - '/bin/mkdir -p "$DEPLOYPATH/api/career"'
    - '/bin/test ! -L "$DEPLOYPATH/api/career"'
    - '/bin/test ! -L "$DEPLOYPATH/career_common.php"'
    - '/bin/test ! -L "$DEPLOYPATH/career_admin.php"'
    - '/bin/test ! -L "$DEPLOYPATH/api/career/index.php"'
    - '/bin/mkdir -p -m 700 "$RELEASEBACKUP/api/career"'
    - 'set -eu; for f in career_common.php career_admin.php api/career/index.php api/tests.php; do if /bin/test -e "$DEPLOYPATH/$f"; then /bin/cp -p "$DEPLOYPATH/$f" "$RELEASEBACKUP/$f"; fi; done; /bin/test -s "$RELEASEBACKUP/api/tests.php"; /bin/cp -p backend/career_common.php "$DEPLOYPATH/career_common.php"; /bin/cp -p backend/career_admin.php "$DEPLOYPATH/career_admin.php"; /bin/cp -p backend/api/career/index.php "$DEPLOYPATH/api/career/index.php"; /bin/cp -p backend/api/tests.php "$DEPLOYPATH/api/tests.php"; /bin/test -s "$DEPLOYPATH/api/tests.php"; /bin/test -s "$DEPLOYPATH/career_common.php"; /bin/test -s "$DEPLOYPATH/career_admin.php"; /bin/test -s "$DEPLOYPATH/api/career/index.php"'
