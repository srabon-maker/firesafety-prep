
workflows:
  fire-safety-generate-keystore-once:
    name: ONE TIME ONLY - Generate Fire Safety BD Release Keystore
    max_build_duration: 15
    instance_type: mac_mini_m2

    # No triggering section: this workflow is manual-only.

    environment:
      groups:
        - fsbd_keystore_generator

    scripts:
      - name: Generate one private Android signing key (manual only)
        script: |
          set -eu
          umask 077

          if [ "${CM_TRIGGER_SOURCE:-}" != "api" ]; then
            echo "ERROR: This workflow must be started manually from Codemagic."
            exit 1
          fi

          if [ "${CM_BRANCH:-}" != "feature/codemagic-one-time-keystore-generator" ]; then
            echo "ERROR: Run the generator only from the dedicated feature branch."
            exit 1
          fi

          : "${FSBD_KEYSTORE_PASSWORD:?Add FSBD_KEYSTORE_PASSWORD as a Secret in Codemagic group fsbd_keystore_generator}"

          if [ "${#FSBD_KEYSTORE_PASSWORD}" -lt 16 ]; then
            echo "ERROR: Use a unique keystore password of at least 16 characters."
            exit 1
          fi

          if ! command -v keytool >/dev/null 2>&1; then
            echo "ERROR: Java keytool is unavailable on this build machine."
            exit 1
          fi

          OUTPUT="build/private-signing/fire-safety-bd-release.jks"
          mkdir -p build/private-signing
          chmod 700 build/private-signing

          if [ -e "$OUTPUT" ]; then
            echo "ERROR: Refusing to overwrite an existing signing key."
            exit 1
          fi

          # The key and keystore intentionally share one strong secret.
          # Never print the password or commit this generated file to Git.
          keytool -genkeypair -noprompt \
            -keystore "$OUTPUT" \
            -storetype JKS \
            -alias fire_safety_bd \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Fire Safety BD, OU=Mobile, O=Fire Safety BD, C=BD" \
            -storepass "$FSBD_KEYSTORE_PASSWORD" \
            -keypass "$FSBD_KEYSTORE_PASSWORD" >/dev/null 2>&1

          test -s "$OUTPUT" || {
            echo "ERROR: Signing key was not created."
            exit 1
          }

          chmod 600 "$OUTPUT"
          echo "Release keystore created successfully."
          echo "Alias: fire_safety_bd"
          echo "Certificate fingerprints (safe to register in Google OAuth):"
          keytool -list -v \
            -keystore "$OUTPUT" \
            -alias fire_safety_bd \
            -storepass "$FSBD_KEYSTORE_PASSWORD" \
            | grep -E '^[[:space:]]*(SHA1:|SHA256:)'

          echo "IMPORTANT: Download the .jks from build Artifacts, back it up"
          echo "securely, upload to Codemagic signing identities, then delete"
          echo "this generator build/artifact and its generator-only secret."

    # Sensitive private key! Only authorized project members should access
    # this ONE-TIME build artifact; delete the build after secure backup/upload.
    artifacts:
      - build/private-signing/fire-safety-bd-release.jks

  fire-safety-job-prep:
    name: Fire Safety BD Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      # Upload this signing identity once in Codemagic Team settings.
      # Do not commit keystore files or passwords to the repository.
      android_signing:
        - fire_safety_bd_release

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate Fire Safety BD Launcher Icon
        script: dart run flutter_launcher_icons

      - name: Check Flutter code
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify permanent release keystore is available
        script: |
          set -eu

          : "${CM_KEYSTORE_PATH:?Upload Android signing identity fire_safety_bd_release in Codemagic}"
          : "${CM_KEYSTORE_PASSWORD:?Missing release keystore password}"
          : "${CM_KEY_ALIAS:?Missing release key alias}"
          : "${CM_KEY_PASSWORD:?Missing release key password}"

          test -f "$CM_KEYSTORE_PATH" || {
            echo "ERROR: Release keystore file not found."
            exit 1
          }

          keytool -list -keystore "$CM_KEYSTORE_PATH" -alias "$CM_KEY_ALIAS" -storepass "$CM_KEYSTORE_PASSWORD" >/dev/null

          echo "Permanent release signing identity verified."

      - name: Run marketplace regression tests
        script: flutter test test/marketplace_catalog_test.dart test/marketplace_transactions_test.dart

      - name: Run profile editor widget tests
        script: flutter test test/profile_edit_test.dart

      - name: Build Android APK with permanent release signing
        script: flutter build apk --release

      - name: Verify Actual APK SHA-1
        script: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "===== APK FILE ====="
          ls -lh "$APK"

          echo "===== ACTUAL RELEASE APK CERTIFICATE ====="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          CERT_DETAILS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERT_DETAILS"

          # Catch accidental signing identity changes before distributing an
          # APK whose SHA-1 is not registered in the Android OAuth client.
          EXPECTED_SHA1="5EFAD539A3B41AAB508CAFD81D8C518125B0EAFC"
          ACTUAL_SHA1=$(printf '%s\n' "$CERT_DETAILS" \
            | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' \
            | tr -d ':\r' \
            | tr '[:lower:]' '[:upper:]')
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "ERROR: Built APK SHA-1 does not match the registered Google Android OAuth client."
            echo "Do not regenerate or replace the permanent signing key."
            exit 1
          fi
          echo "Release APK signing SHA-1 matches the registered Google OAuth certificate."

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
